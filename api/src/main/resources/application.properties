spring.application.name=capital-humano-api
server.port=8080

# ==============================================================================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL / Neon.tech)
# ==============================================================================
# Para usar Neon:
#   Formato JDBC: jdbc:postgresql://<endpoint>.neon.tech:5432/<dbname>?sslmode=require
# Podés configurar las variables de entorno DB_URL, DB_USER y DB_PASSWORD en tu IDE
# o reemplazar los valores por defecto localmente (¡no subir credenciales reales a GitHub público!).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/capital_humano}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones Hikari ajustado para Neon (evita cortes por idle timeout de serverless)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.maximum-pool-size=5

# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
