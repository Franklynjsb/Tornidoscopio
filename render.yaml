# render.yaml - Deploy backend (API) to Render.com
services:
  - type: web
    name: tornidoscopio-api
    env: docker
    dockerfilePath: api/Dockerfile
    plan: free
    # Environment variables – set them in Render UI
    envVars:
      # Example placeholders (replace with real values in Render)
      # DB_URL=jdbc:postgresql://<host>:5432/<db>?sslmode=require
      # DB_USER=your_user
      # DB_PASSWORD=your_password
    healthCheckPath: /actuator/health
    autoDeploy:
      branch: deploy/render
