# Application name
spring.application.name=capital-humano-api

# -------------------------------------------------
# Server configuration (Render provides $PORT)
# -------------------------------------------------
server.port=${PORT:8080}

# -------------------------------------------------
# Spring profile (default "dev"; Render can set SPRING_PROFILES_ACTIVE=prod)
# -------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -------------------------------------------------
# Database configuration – read from environment variables
# -------------------------------------------------
# Example for Neon/PostgreSQL – replace with your own DB if needed
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Driver (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool settings (tuned for serverless / Neon)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.maximum-pool-size=5

# -------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------
# Logging (console output)
# -------------------------------------------------
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
